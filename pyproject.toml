[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-compass"
version = "0.1.0"
description = "Evidence-backed university course information"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
course-compass = "course_compass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
course_compass = ["static/*"]
